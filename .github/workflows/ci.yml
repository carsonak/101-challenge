name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: docker.io/axllent/mailpit:v1.31.2
        ports:
          - 1026:1025
          - 8026:8025
      postgres:
        image: docker.io/library/postgres:17.11-alpine
        env:
          POSTGRES_USER: challenge
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: challenge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U challenge -d challenge_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://challenge:ci_only@127.0.0.1:5432/challenge_ci
      TRACKER_TEST_DATABASE_URL: postgresql://challenge:ci_only@127.0.0.1:5432/challenge_ci
      QUEUE_SCHEMA: pgboss_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm database:migrate
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          APP_ORIGIN: http://127.0.0.1:3101
          PORT: 3101
          SMTP_PORT: 1026
          QA_BASE_URL: http://127.0.0.1:3101
          QA_MAILPIT_URL: http://127.0.0.1:8026
        run: |
          pnpm start:web > "$RUNNER_TEMP/qa-web.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:3101/api/ready
          pnpm test:browser
