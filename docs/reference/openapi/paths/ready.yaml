get:
  operationId: workerReady
  summary: Worker ready
  security: []
  description: >-
    Readiness requires configured database connectivity and applied tracker
    migrations.
  responses:
    "200":
      description: Service available.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WorkerHealth.yaml
    "503":
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WorkerHealth.yaml
servers:
  - url: http://localhost:3001
    description: Worker origin; replace with configured WORKER_HOST/WORKER_PORT.
