get:
  operationId: listPublishedSeasons
  summary: listPublishedSeasons
  description: ""
  security: []
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SeasonPage.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - name: cursor
      in: query
      schema:
        type: string
        maxLength: 1000
      description: >-
        Opaque cursor scoped to this collection; omit on the first page. Other
        query parameters are rejected.
