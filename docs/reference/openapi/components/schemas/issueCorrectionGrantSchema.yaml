anyOf:
  - type: object
    properties:
      command:
        type: string
        const: IssueCorrectionGrant
      kind:
        type: string
        const: single_report
      reportId:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    required:
      - command
      - kind
      - reportId
    additionalProperties: false
  - type: object
    properties:
      command:
        type: string
        const: IssueCorrectionGrant
      kind:
        type: string
        const: attempt_window
      attemptId:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      durationMinutes:
        type: integer
        minimum: 1
        maximum: 60
    required:
      - command
      - kind
      - attemptId
      - durationMinutes
    additionalProperties: false
