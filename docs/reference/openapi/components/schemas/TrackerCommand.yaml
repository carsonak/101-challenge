description: >-
  Strict command objects; server checks authorization, lifecycle, ownership and
  custom refinements. Milestone goalIndex must reference the submitted goal
  list; goalValues and milestoneAchievements must use distinct IDs. Timezones
  must be valid IANA names. Decimal strings have at most 18 total digits and 6
  fractional digits; supplied targets must be positive.
