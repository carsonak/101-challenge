anyOf:
  - type: object
    properties:
      action:
        type: string
        const: signup
      email:
        type: string
        maxLength: 254
        format: email
        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      password:
        type: string
        minLength: 12
        maxLength: 128
      username:
        type: string
        minLength: 3
        maxLength: 40
        pattern: ^[a-zA-Z0-9_-]+$
    required:
      - action
      - password
      - username
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: login
      email:
        type: string
        maxLength: 254
        format: email
        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - email
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: recover
      email:
        type: string
        maxLength: 254
        format: email
        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
    required:
      - action
      - email
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: verify
      token:
        type: string
        pattern: ^[a-f0-9]{64}$
    required:
      - action
      - token
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: reset
      token:
        type: string
        pattern: ^[a-f0-9]{64}$
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - token
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: logout
    required:
      - action
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: save_profile
      username:
        type: string
        minLength: 3
        maxLength: 40
        pattern: ^[a-zA-Z0-9_-]+$
    required:
      - action
      - username
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: set_avatar
      avatar:
        anyOf:
          - type: string
            maxLength: 400000
          - type: "null"
    required:
      - action
      - avatar
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: recovery_email
      email:
        type: string
        maxLength: 254
        format: email
        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
    required:
      - action
      - email
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: verify_recovery_email
      token:
        type: string
        pattern: ^[a-f0-9]{64}$
    required:
      - action
      - token
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: restore_account
    required:
      - action
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: revoke_session
      sessionId:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    required:
      - action
      - sessionId
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: notification
      id:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      dismiss:
        default: false
        type: boolean
    required:
      - action
      - id
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: reauthenticate
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: add_email
      email:
        type: string
        maxLength: 254
        format: email
        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - email
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: unlink
      provider:
        type: string
        enum:
          - email
          - google
          - discord
    required:
      - action
      - provider
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: request_erasure
      confirmed:
        type: boolean
        const: true
      username:
        type: string
        minLength: 3
        maxLength: 40
        pattern: ^[a-zA-Z0-9_-]+$
    required:
      - action
      - confirmed
      - username
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: resend_verification
      email:
        type: string
        format: email
        maxLength: 254
    required:
      - action
      - email
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: change_password
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: login
      identifier:
        anyOf:
          - type: string
            minLength: 3
            maxLength: 40
            pattern: ^[a-zA-Z0-9_-]+$
          - type: string
            format: email
            maxLength: 254
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - identifier
      - password
    additionalProperties: false
  - type: object
    properties:
      action:
        type: string
        const: login
      username:
        type: string
        minLength: 3
        maxLength: 40
        pattern: ^[a-zA-Z0-9_-]+$
      password:
        type: string
        minLength: 12
        maxLength: 128
    required:
      - action
      - username
      - password
    additionalProperties: false
description:
  "Signup requires username/password; email is optional and must be verified before\
  \ email-alias login or recovery. Login accepts identifier (username or verified recovery email),\
  \ username, or legacy email with password. Usernames are 3\u201340 URL-safe ASCII letters/digits/underscores/hyphens\
  \ without spaces and normalized to lowercase. Anonymous actions: signup, login, recover, resend_verification,\
  \ verify, reset, verify_recovery_email. Other actions require session and x-csrf-token; add_email,\
  \ unlink, request_erasure, recovery_email and change_password also require authentication\
  \ within ten minutes. change_password can add a first password to a provider account and revokes\
  \ all sessions. Matching email never merges accounts."
