type: object
properties:
  id:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  username:
    type: string
  provisional:
    type: boolean
  avatar:
    type:
      - string
      - "null"
  recoveryEmail:
    type:
      - string
      - "null"
  deletion:
    anyOf:
      - type: object
        properties:
          requestedAt:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          deleteAfter:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        required:
          - requestedAt
          - deleteAfter
      - type: "null"
  email:
    type:
      - string
      - "null"
  emailVerified:
    type: boolean
  providers:
    type: array
    items:
      type: string
      enum:
        - google
        - discord
  admin:
    type: boolean
  hasPassword:
    type: boolean
    description: Whether username/password sign-in is enabled independently of optional email.
required:
  - id
  - username
  - provisional
  - avatar
  - recoveryEmail
  - deletion
  - email
  - emailVerified
  - providers
  - admin
  - hasPassword
additionalProperties: false
