type: object
properties:
  command:
    type: string
    const: SaveMilestone
  attemptId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  expectedAttemptVersion:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  milestoneId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  milestone:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string
        maxLength: 4000
      targetReportingDay:
        type: integer
        minimum: 1
        maximum: 101
      achievementKind:
        type: string
        enum:
          - manual
          - reporting_count
      goalId:
        type: string
        format: uuid
        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    required:
      - title
      - targetReportingDay
      - achievementKind
    additionalProperties: false
required:
  - command
  - attemptId
  - expectedAttemptVersion
  - milestone
additionalProperties: false
