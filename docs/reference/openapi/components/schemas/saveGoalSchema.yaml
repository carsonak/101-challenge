type: object
properties:
  command:
    type: string
    const: SaveGoal
  attemptId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  expectedAttemptVersion:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  goalId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  goal:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string
        maxLength: 4000
      kind:
        type: string
        enum:
          - qualitative
          - count
          - duration
          - quantity
      unit:
        type: string
        minLength: 1
        maxLength: 40
      target:
        type: string
        pattern: ^(0|[1-9]\d*)(\.\d{1,6})?$
    required:
      - title
      - kind
    additionalProperties: false
required:
  - command
  - attemptId
  - expectedAttemptVersion
  - goal
additionalProperties: false
