type: object
properties:
  command:
    type: string
    const: EditReport
  reportId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  expectedReportVersion:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  body:
    type: string
    minLength: 1
    maxLength: 4000
  goalValues:
    maxItems: 20
    type: array
    items:
      type: object
      properties:
        goalRevisionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        value:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,6})?$
      required:
        - goalRevisionId
        - value
      additionalProperties: false
required:
  - command
  - reportId
  - expectedReportVersion
  - body
  - goalValues
additionalProperties: false
