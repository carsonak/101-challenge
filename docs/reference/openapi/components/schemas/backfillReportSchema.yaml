type: object
properties:
  command:
    type: string
    const: BackfillReport
  attemptId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  expectedAttemptVersion:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  body:
    type: string
    minLength: 1
    maxLength: 4000
  goalValues:
    maxItems: 20
    type: array
    items:
      type: object
      properties:
        goalRevisionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        value:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,6})?$
      required:
        - goalRevisionId
        - value
      additionalProperties: false
  milestoneAchievements:
    default: []
    maxItems: 101
    type: array
    items:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  reportingDate:
    type: string
    format: date
    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
required:
  - command
  - attemptId
  - expectedAttemptVersion
  - body
  - goalValues
  - reportingDate
additionalProperties: false
