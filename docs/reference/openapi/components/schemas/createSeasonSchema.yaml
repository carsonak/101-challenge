type: object
properties:
  command:
    type: string
    const: CreateSeason
  slug:
    type: string
    maxLength: 80
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  title:
    type: string
    minLength: 1
    maxLength: 200
  description:
    type: string
    maxLength: 4000
required:
  - command
  - slug
  - title
additionalProperties: false
