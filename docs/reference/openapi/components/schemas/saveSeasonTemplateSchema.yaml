type: object
properties:
  command:
    type: string
    const: SaveSeasonTemplate
  seasonId:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  expectedSeasonVersion:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  goals:
    maxItems: 20
    type: array
    items:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        kind:
          type: string
          enum:
            - qualitative
            - count
            - duration
            - quantity
        unit:
          type: string
          minLength: 1
          maxLength: 40
        target:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,6})?$
      required:
        - title
        - kind
      additionalProperties: false
  milestones:
    maxItems: 101
    type: array
    items:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        targetReportingDay:
          type: integer
          minimum: 1
          maximum: 101
        goalIndex:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        achievementKind:
          type: string
          enum:
            - manual
            - reporting_count
      required:
        - title
        - targetReportingDay
        - achievementKind
      additionalProperties: false
  sessionUrl:
    type: string
    format: uri
required:
  - command
  - seasonId
  - expectedSeasonVersion
  - goals
  - milestones
additionalProperties: false
