type: object
properties:
  slug:
    type: string
  publishedAt:
    anyOf:
      - type: string
        format: date-time
        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      - type: "null"
  id:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
  title:
    type: string
  description:
    type:
      - string
      - "null"
  featured:
    type: boolean
  state:
    type: string
    enum:
      - draft
      - published
  version:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  goals:
    type: array
    items:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        kind:
          type: string
          enum:
            - qualitative
            - count
            - duration
            - quantity
        unit:
          type: string
          minLength: 1
          maxLength: 40
        target:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,6})?$
      required:
        - title
        - kind
      additionalProperties: false
  milestones:
    type: array
    items:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        targetReportingDay:
          type: integer
          minimum: 1
          maximum: 101
        goalIndex:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        achievementKind:
          type: string
          enum:
            - manual
            - reporting_count
      required:
        - title
        - targetReportingDay
        - achievementKind
      additionalProperties: false
  sessionUrl:
    type:
      - string
      - "null"
required:
  - slug
  - publishedAt
  - id
  - title
  - description
  - featured
  - state
  - version
  - goals
  - milestones
  - sessionUrl
additionalProperties: false
