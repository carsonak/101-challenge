openapi: 3.1.0
info:
  title: 101 Challenge HTTP API
  version: 0.1.0-dev
  description:
    Documentation of the current local tracker. Cookie-authenticated browser
    API plus OAuth callbacks, signed Discord ingress and service health. JSON browser
    responses use private, no-store caching. Custom domain validation remains authoritative;
    no new endpoints are introduced by this document.
servers:
  - url: http://localhost:3000
    description: Local web origin; replace with configured APP_ORIGIN.
paths:
  /api/v1/session:
    $ref: paths/api_v1_session.yaml
  /api/v1/seasons:
    $ref: paths/api_v1_seasons.yaml
  /api/v1/seasons/{seasonId}:
    $ref: paths/api_v1_seasons_{seasonId}.yaml
  /api/v1/sessions:
    $ref: paths/api_v1_sessions.yaml
  /api/v1/notifications:
