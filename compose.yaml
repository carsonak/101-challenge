services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-challenge_local}
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAIL_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
